# Generates MusicSynq.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#
#   brew install xcodegen
#   cd ios && xcodegen
#
# Before building, set PRODUCT_BUNDLE_IDENTIFIER below to an App ID you own
# that has the MusicKit app service and Push Notifications enabled.
name: MusicSynq
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer team ID (or pick a team in Xcode's Signing & Capabilities tab).
    DEVELOPMENT_TEAM: ""

packages:
  MusicSynqKit:
    path: MusicSynqKit

targets:
  MusicSynq:
    type: application
    platform: iOS
    sources:
      - path: MusicSynq
    dependencies:
      - package: MusicSynqKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicsynq
        INFOPLIST_FILE: MusicSynq/Info.plist
        CODE_SIGN_ENTITLEMENTS: MusicSynq/MusicSynq.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        # Where the app finds the server. Change it in the app under
        # Settings > Server, or here for every build.
        MUSICSYNQ_SERVER_URL: "http://localhost:8080"
